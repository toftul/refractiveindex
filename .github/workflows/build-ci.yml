name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Weekly run against the latest upstream database, so that
  # TestCatalogFixes.test_fixes_still_needed reports upstream fixes.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Setup environment
        run: |
            python -m pip install --upgrade pip
            pip install .
            pip install pytest

      - name: Run Python tests
        run: pytest
