name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check release tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["tool"]["poetry"]["version"])')"
          echo "Release tag version: $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Release tag ($TAG_VERSION) does not match pyproject.toml version ($PKG_VERSION)"
            exit 1
          fi

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check that the wheel contains the database
        run: |
          python - <<'EOF'
          import glob, subprocess, sys, zipfile
          tracked = subprocess.run(["git", "ls-files", "-z", "refractiveindex/database"],
                                   capture_output=True, check=True).stdout.decode().split("\0")
          expected = {name for name in tracked if name}
          wheel = glob.glob("dist/*.whl")[0]
          found = {name for name in zipfile.ZipFile(wheel).namelist()
                   if name.startswith("refractiveindex/database/")}
          if "refractiveindex/database/catalog-nk.yml" not in found or found != expected:
              print(f"::error::{wheel} has {len(found)} database files, git tracks {len(expected)}. "
                    f"Missing: {sorted(expected - found)[:5]}. Extra: {sorted(found - expected)[:5]}.")
              sys.exit(1)
          print(f"{wheel} contains all {len(found)} database files.")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
